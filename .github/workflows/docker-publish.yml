# Build and push Instamagic images.
# Prefer Docker Hub (vars.DOCKERHUB_USERNAME + secrets.DOCKERHUB_TOKEN, same
# names as Metrik/MonkeyTracker). If DOCKERHUB_USERNAME is unset, push to GHCR
# only (GITHUB_TOKEN). Stage compose defaults to Docker Hub image names.
#
# Images:
#   <hub-user>/instamagic-backend   (API, migrate, worker-io, worker-ml)
#   <hub-user>/instamagic-frontend  (nginx SPA)
# Tags: YYYYMMDD-XX (America/Argentina calendar day + sequential build),
#       semver (on v*), sha-<short>, latest (default branch), branch name.
# APP_VERSION is baked into both images (ENV / VITE_APP_VERSION) so UI and
# /health|/api/config show the same build id.

name: Publish Docker images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  # Reuse the same gates as ci.yml before publishing.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff
        run: ruff check instamagic tests
      - name: Pytest (incl. security suite)
        env:
          APP_PASSWORD: test-password-123
          APP_SECRET: test-secret-value-123456
          SAFETY_CLASSIFIER: fake
          GEMINI_PROVIDER: fake
          PIPELINE_MODE: inline
          GEMINI_IMAGE_POLICY: text_only
          ENVIRONMENT: local
          BIND_HOST: 127.0.0.1
          AUTO_PUBLISH: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck / build
        run: npm run build

  version:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: read
    outputs:
      app_version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compute APP_VERSION (YYYYMMDD-XX)
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION_OWNER: ${{ github.repository_owner }}
        run: |
          chmod +x scripts/compute-app-version.sh
          VER="$(scripts/compute-app-version.sh)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${VER}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend, frontend, version]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
          - name: frontend
            dockerfile: docker/frontend.Dockerfile

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (GHCR)
        id: meta_ghcr
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/instamagic-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.app_version }}

      - name: Docker metadata (Docker Hub)
        id: meta_dh
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/instamagic-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.app_version }}

      - name: Merge image tags
        id: tags
        run: |
          {
            echo "${{ steps.meta_ghcr.outputs.tags }}"
            if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
              echo "${{ steps.meta_dh.outputs.tags }}"
            fi
          } | sed '/^$/d' > /tmp/tags.txt
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tags.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Published tags:"
          cat /tmp/tags.txt
          echo "APP_VERSION=${{ needs.version.outputs.app_version }}"

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Stage host is linux/amd64. Do not publish arm64-only manifests
          # (a plain docker build on Apple Silicon breaks remote pull).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
