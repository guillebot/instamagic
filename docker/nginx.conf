# Access-log masking: never write OAuth code/state, tokens or sealed
# page-selection payloads ("pending") from query strings to the log.
map $request_uri $im_log_uri {
  default $request_uri;
  "~^(?<im_cb>/api/instagram/oauth/callback/?)\?" "${im_cb}?[REDACTED]";
  "~*^(?<im_path>[^?]*)\?(?:.*&)?(?:access_token|input_token|fb_exchange_token|token|client_secret|pending)=" "${im_path}?[REDACTED]";
}

map $http_referer $im_log_referer {
  default $http_referer;
  "~^(?<im_rcb>[^?]*/api/instagram/oauth/callback/?)\?" "${im_rcb}?[REDACTED]";
  "~*^(?<im_rpath>[^?]*)\?(?:.*&)?(?:access_token|input_token|fb_exchange_token|token|client_secret|pending)=" "${im_rpath}?[REDACTED]";
}

log_format im_masked '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $im_log_uri $server_protocol" $status $body_bytes_sent '
                     '"$im_log_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name localhost;
  access_log /var/log/nginx/access.log im_masked;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  # Real client IP. Only the Traefik hop (a Docker bridge address) may supply it,
  # via the X-Forwarded-For that Traefik rewrites (it strips client-sent forwarded
  # headers: no forwardedHeaders.trustedIPs on its entrypoints). real_ip_recursive
  # off = take only the LAST entry, the one Traefik appended. LAN (10.0.0.0/8) is
  # deliberately NOT trusted. Every upstream block below then OVERWRITES
  # X-Real-IP and X-Forwarded-For with $remote_addr, so no client-supplied value
  # ever reaches the backend (trusted-IP auto-login and login rate limits rely on it).
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  # Docker embedded DNS. Variable proxy_pass forces re-resolve so a recreated
  # backend (new container IP) does not leave this long-lived nginx on a stale upstream.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Derivatives are small JPEGs; buffer so the browser gets them in fewer chunks.
    proxy_buffering on;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_pass http://$backend_upstream;
  }

  location /health {
    set $backend_upstream backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://$backend_upstream;
  }

  location /ready {
    set $backend_upstream backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://$backend_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
