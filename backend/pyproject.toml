[project]
name = "instamagic"
version = "0.1.0"
description = "Local review and publishing assistant for an existing Instagram photography archive."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "numpy>=2.1",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "pgvector>=0.3.6",
  "pillow>=11",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "rq>=2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["instamagic", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["instamagic*"]
